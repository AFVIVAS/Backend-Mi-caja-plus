<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/styles/dashboard.css">
    <script src="/static/js/dashboard.js"></script>
    <link rel="icon" type="image/png" href="/static/img/LogoMiCajaPlus.png">
</head>
<body>
    <main id="cont_ppal">
        <header id="caja_hijo1">
            <div id="cajaMenu">
                <h3 id="nombreTendero">Admin</h3>

                <figure id="logoCajaPlus">
                    <img src="/static/img/LogoMiCajaPlus.png"
                        alt="Logo MiCajaPlus">
                </figure>

                <button id="btnMenu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50">
                        <path
                            d="M 5 8 A 2.0002 2.0002 0 1 0 5 12 L 45 12 A 2.0002 2.0002 0 1 0 45 8 L 5 8 z M 5 23 A 2.0002 2.0002 0 1 0 5 27 L 45 27 A 2.0002 2.0002 0 1 0 45 23 L 5 23 z M 5 38 A 2.0002 2.0002 0 1 0 5 42 L 45 42 A 2.0002 2.0002 0 1 0 45 38 L 5 38 z">
                        </path>
                    </svg>
                </button>
            </div>
            <nav id="menuLateral" class="menu-cerrado">
                <div id="cabeceraMenu">
                    <h2>Filtros</h2>
                    <button id="cerrarMenu" >✕</button>
                </div>

                <form id="formFiltros">
                    <div class="grupo-input">
                        <label>Fecha Inicial:</label>
                        <input type="date">
                    </div>

                    <div class="grupo-input">
                        <label>Fecha Final:</label>
                        <input type="date">
                    </div>
                    <div id="contBotones" >
                        <button type="submit" id="btnBuscar" class="botones">Buscar</button>
                        <button type="reset" id="btnLimpiar" class="botones">Quitar Filtros</button>
                    </div>
                    
                </form>
            </nav>
        </header>
        <section id="caja_hijo2">
            <article id="cajaTarjetas">
                <div id="tarjetaUno" class="tarjetas">
                    <div id="textVenta" class="alineTarjeta">
                        <figure id="icnVenta" class="iconosTarjetas">
                            <img src="/static/img/ic_venta.png" alt="Ventas">
                        </figure>
                        <h4>Ventas</h4>
                    </div>
                    <p>$0</p>
                </div>
                <div id="tarjetaDos" class="tarjetas">
                    <div id="textCosto" class="alineTarjeta">
                        <figure id="icnCostos" class="iconosTarjetas">
                            <img src="/static/img/ic_costos_d.png" alt="Costos">
                        </figure>
                        <h4>Costos</h4>
                    </div>
                    <p>$0</p>
                </div>
                <div id="tarjetaTres" class="tarjetas">
                    <div id="textoGasto" class="alineTarjeta">
                        <figure id="icnGastos" class="iconosTarjetas">
                            <img src="/static/img/ic_gastos.png" alt="Gastos">
                        </figure>
                        <h4>Gastos</h4>
                    </div>
                    <p class="alineTarjeta">$0</p>
                </div>
                <div id="tarjetaCuatro" class="tarjetas">
                    <div id="textFiado" class="alineTarjeta">
                        <figure id="icFiado" class="iconosTarjetas">
                            <img src="/static/img/ic_usuario_credito.png" alt="Fiado">
                        </figure>
                        <h4>Fiados</h4>
                    </div>
                    <p>0</p>
                </div>
                <div id="tarjetaFinal" class="tarjetas">
                    <div id="textUtilidad" class="alineTarjeta">
                        <figure id="icUtilidad">
                            <img src="/static/img/ic_utilidad.png" alt="Utilidad">
                        </figure>
                        <h4>Utilidad</h4>
                    </div>
                    <p id="nUtilidad">$0</p>
                </div>
            </article>
            <article id="cajaHistorial">
                <h2 id="tituloHis">Historial</h2>
            </article>
        </section>
    </main>
</body>
</html>
